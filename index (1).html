<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DatePact</title>

<!-- 홈 화면에 추가했을 때 쓰일 아이콘/이름 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DatePact">
<meta name="theme-color" content="#FF7FA3">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FFF3F7;
  }

  /*
    ↓↓↓ 여기 숫자만 바꾸면 잘리는 높이가 조절돼요 ↓↓↓
    앱스크립트 상단 안내 바 높이가 기기마다 살짝 다를 수 있어서
    실제로 열어보고 안내 바가 남아있으면 CROP_HEIGHT를 조금 더 크게,
    본문이 너무 많이 잘리면 더 작게 조절해주세요.
  */
  :root {
    --crop-height: 56px;
  }

  .frame-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  iframe {
    position: absolute;
    top: calc(-1 * var(--crop-height));
    left: 0;
    width: 100%;
    height: calc(100% + var(--crop-height));
    border: none;
  }
</style>
</head>
<body>

  <div class="frame-wrap">
    <!--
      ↓↓↓ 여기에 배포한 앱스크립트 웹앱 주소(…/exec)를 붙여넣으세요 ↓↓↓
    -->
    <iframe
      src="https://script.google.com/macros/s/여기에_배포된_스크립트_ID/exec"
      title="DatePact"
      allow="clipboard-write"
    ></iframe>
  </div>

</body>
</html>
